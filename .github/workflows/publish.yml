name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
      id-token: write # pub.dev OIDC automated publishing
    steps:
      - uses: actions/checkout@v5

      # pub resolves example/ too, which needs flutter_test from the Flutter
      # SDK, so a Dart-only setup fails here. flutter ships dart as well.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dart-lang/setup-dart@v1 # configures pub.dev OIDC credentials

      - run: flutter pub publish --force

      # Turn the tag into a GitHub Release so watchers get notified and each
      # version gets its own page. Notes come from this version's CHANGELOG
      # section, so the release and the changelog can never drift apart.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '
            $0 == heading { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the changes in this version." > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
