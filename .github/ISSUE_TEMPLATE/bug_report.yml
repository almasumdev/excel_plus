name: Bug report
description: A file will not open, or the output is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Spreadsheet software writes a lot of things the specification does not
        describe, so knowing where the file came from usually decides how fast
        this can be tracked down.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
      placeholder: decodeBytes throws on a file Excel opens without complaint
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: What were you doing
      multiple: true
      options:
        - Reading an existing file
        - Creating a file from scratch
        - Editing a file and saving it back
        - Reading a legacy .xls file
        - CSV import or export
        - Formulas or recalculation
        - Styling, number formats or charts
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Where did the file come from
      description: The application or library that wrote it, and its version if you know.
      placeholder: Excel 365 for Windows, Google Sheets export, LibreOffice 24.2
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: excel_plus version
      placeholder: 2.16.0
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: Dart or Flutter version
      placeholder: Dart 3.8.0, or Flutter 3.35.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      multiple: true
      options:
        - Dart VM (server or CLI)
        - Flutter Android
        - Flutter iOS
        - Flutter desktop
        - Web (dart2js)
        - Web (wasm)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      description: The smallest snippet that shows the problem.
      render: dart
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error and stack trace
      render: shell

  - type: textarea
    id: file
    attributes:
      label: The file, if you can share it
      description: |
        Drag it in, or say why not. Strip anything sensitive first; a cut-down
        copy with two rows usually still reproduces. If you cannot share it,
        describe what is in it: merged cells, charts, images, pivot tables,
        conditional formatting, data validation, custom number formats.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest published version.
          required: true
        - label: The file opens correctly in the application that wrote it.
          required: false
